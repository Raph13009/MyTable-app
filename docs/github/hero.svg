<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Guide My Table  live</title>
  <desc id="desc">Plateforme live de chefs à domicile. Explorer, réserver, converser.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="45%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#FBCF03" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#FBCF03" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FBCF03" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBCF03" stop-opacity="0"/>
      <stop offset="18%" stop-color="#FBCF03" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#FBCF03" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FBCF03" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FBCF03" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="overlay"/>
    </filter>
  </defs>

  <rect width="1600" height="820" fill="url(#wash)"/>
  <rect width="1600" height="820" fill="url(#grid)"/>
  <rect width="1600" height="820" fill="url(#goldGlow)"/>
  <rect width="1600" height="820" fill="#000" opacity="0.12" filter="url(#grain)"/>

  <!-- lookbook crop marks -->
  <g fill="none" stroke="#FBCF03" stroke-opacity="0.55" stroke-width="1.25">
    <path d="M48 28v36M28 48h36"/>
    <path d="M1552 28v36M1572 48h-36"/>
    <path d="M48 792v-36M28 772h36"/>
    <path d="M1552 792v-36M1572 772h-36"/>
  </g>
  <rect x="64" y="64" width="1472" height="692" fill="none" stroke="#F7F4EC" stroke-opacity="0.08"/>

  <!-- top meta -->
  <g fill="#F7F4EC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" letter-spacing="0.28em">
    <text x="96" y="112" font-size="12" fill="#FBCF03">GMT / 001</text>
    <text x="800" y="112" font-size="12" text-anchor="middle" fill="#A3A09A">PARIS · FR</text>
    <text x="1504" y="112" font-size="12" text-anchor="end">PRODUCTION</text>
  </g>

  <line x1="180" y1="148" x2="1420" y2="148" stroke="url(#goldLine)" stroke-width="1"/>

  <!-- live pill -->
  <g transform="translate(800 214)">
    <rect x="-78" y="-18" width="156" height="36" rx="18" fill="#FBCF03"/>
    <circle cx="-52" cy="0" r="4.5" fill="#0A0A0A"/>
    <text x="8" y="5" text-anchor="middle" fill="#0A0A0A" font-size="13" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="700" letter-spacing="0.34em">LIVE</text>
  </g>

  <text x="800" y="348" text-anchor="middle" fill="#F7F4EC" font-size="22" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="500" letter-spacing="0.62em">GUIDE</text>
  <text x="800" y="468" text-anchor="middle" fill="#F7F4EC" font-size="118" font-family="Georgia, 'Times New Roman', Times, serif" letter-spacing="-0.03em">My Table</text>
  <text x="800" y="536" text-anchor="middle" fill="#FBCF03" font-size="18" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-weight="600" letter-spacing="0.04em">Lart culinaire privé, sélectionné avec soin, pour vous.</text>
  <text x="800" y="582" text-anchor="middle" fill="#8E8A82" font-size="16" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" letter-spacing="0.08em">Chefs à domicile · carte · réservation · conversation</text>

  <line x1="180" y1="640" x2="1420" y2="640" stroke="url(#goldLine)" stroke-width="1"/>

  <g fill="#F7F4EC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="0.22em">
    <text x="280" y="700" text-anchor="middle">01  EXPLORE</text>
    <text x="590" y="700" text-anchor="middle">02  BOOK</text>
    <text x="900" y="700" text-anchor="middle">03  TALK</text>
    <text x="1210" y="700" text-anchor="middle">04  HOST</text>
  </g>
  <g fill="#FBCF03" font-size="6">
    <circle cx="280" cy="724" r="2.4"/>
    <circle cx="590" cy="724" r="2.4"/>
    <circle cx="900" cy="724" r="2.4"/>
    <circle cx="1210" cy="724" r="2.4"/>
  </g>
</svg>
